# 知危鉴 · 全栈一键编排
# 使用：在 zhiweijian/ 目录执行  docker compose up -d --build
# 结果：http://localhost:8080  → 前端演示页（Nginx 网关，单端口）
#       http://localhost:8080/api  → 反向代理到 FastAPI 后端
# 本地开发（不起容器）：
#   前端  cd frontend && python -m http.server 5173
#   后端  cd backend && uvicorn app.main:app --reload --port 8000

services:
  backend:
    build: ./backend
    container_name: zhiweijian-backend
    restart: unless-stopped
    # 本地调试可放开：
    # ports:
    #   - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - zwj

  frontend:
    build: ./frontend
    container_name: zhiweijian-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - zwj

networks:
  zwj:
    driver: bridge
